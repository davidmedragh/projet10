[project]
name = "projet10"
version = "0.1.0"
description = "Projet 10 — Labellisez et appliquez des approches semi-supervisées en traitement d'images (OpenClassrooms, parcours Data Scientist)"
readme = "README.md"
authors = [
    { name = "David MEDRAGH" },
]
requires-python = ">=3.11"
dependencies = [
    # Kernel Jupyter pour l'exécution des notebooks dans VS Code
    "ipykernel>=7.2.0",
    # Widgets Jupyter : barres de progression tqdm dans les notebooks
    "ipywidgets>=8.1.8",
    # Visualisation : graphiques, grilles d'images, histogrammes
    "matplotlib>=3.10.9",
    # Rendu des sorties Plotly dans les notebooks Jupyter
    "nbformat>=5.10.4",
    # Calcul numérique : manipulation de tableaux, opérations sur les pixels
    "numpy>=2.4.4",
    # Traitement d'images : redimensionnement, filtres, conversion de couleurs (recommandé par l'école)
    "opencv-python>=4.13.0.92",
    # DataFrames : tableaux récapitulatifs, agrégations par dossier
    "pandas>=3.0.3",
    # Ouverture et vérification technique des images (dimensions, mode, intégrité)
    "pillow>=12.2.0",
    # Visualisation interactive : scatter plots de clusters (recommandé par l'école)
    "plotly>=6.7.0",
    # Machine learning : PCA, K-Means, DBSCAN, ARI, StandardScaler (recommandé par l'école)
    "scikit-learn>=1.8.0",
    # Visualisation statistique : scatter plots, heatmaps (recommandé par l'école)
    "seaborn>=0.13.2",
    # Framework deep learning : tenseurs, modèles pré-entraînés (étapes 2-4)
    "torch>=2.11.0",
    # Vision par ordinateur : ImageFolder, transforms, modèles pré-entraînés (ResNet50)
    "torchvision>=0.26.0",
    # Barres de progression pour le suivi des entraînements CNN
    "tqdm>=4.67.3",
]
